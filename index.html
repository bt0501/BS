<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Breathing Station | PRO Terminal</title>
    <!-- Загружаем библиотеки: Socket.io и надежный виджет TradingView -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --bg: #0b0e11; --green: #0ecb81; --red: #f6465d; --gold: #f0b90b; --gray: #848e9c; }
        body { background: var(--bg); color: #eaecef; font-family: 'Consolas', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Компактная шапка */
        #header { height: 35px; display: flex; align-items: center; padding: 0 15px; background: #161a1e; border-bottom: 1px solid #2b3139; justify-content: space-between; flex-shrink: 0; }
        .logo { color: var(--gold); font-size: 12px; font-weight: bold; letter-spacing: 1px; }
        .status { font-size: 11px; }
        input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 2px 5px; width: 100px; font-size: 11px; border-radius: 3px; }
        button { background: var(--gold); border: none; padding: 2px 10px; cursor: pointer; font-weight: bold; font-size: 11px; border-radius: 3px; }

        /* График (занимает 35% высоты - аккуратно и компактно) */
        #chart-wrap { height: 35%; width: 100%; flex-shrink: 0; background: #000; border-bottom: 2px solid var(--gold); }

        /* Терминал (65% высоты - МНОГО МЕСТА) */
        #terminal { 
            height: 65%; 
            background: #000; 
            overflow-y: auto; 
            padding: 10px 15px;
            display: flex;
            flex-direction: column-reverse; /* Новые данные всегда сверху */
        }

        /* Увеличенный шрифт для бегущей строки */
        .row { 
            white-space: nowrap; 
            line-height: 1.6; 
            border-bottom: 1px solid #111; 
            font-size: 16px; /* Было 13px, сделал 16px чтобы глаза не уставали */
            font-weight: 500;
        }
        
        .row.buy { color: var(--green); text-shadow: 0 0 5px rgba(14, 203, 129, 0.2); }
        .row.sell { color: var(--red); text-shadow: 0 0 5px rgba(246, 70, 93, 0.2); }
        .dim { color: var(--gray); font-size: 14px; }
        .gold { color: var(--gold); }
        .watermark { position: fixed; bottom: 5px; right: 15px; font-size: 12px; color: var(--gold); opacity: 0.4; pointer-events: none; }
    <style>
    :root { --bg: #0b0e11; --green: #0ecb81; --red: #f6465d; --gold: #f0b90b; --gray: #848e9c; }
    body { background: var(--bg); color: #eaecef; font-family: 'Consolas', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    #header { height: 35px; display: flex; align-items: center; padding: 0 15px; background: #161a1e; border-bottom: 1px solid #2b3139; justify-content: space-between; flex-shrink: 0; }
    .logo { color: var(--gold); font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 2px 5px; width: 100px; font-size: 11px; border-radius: 3px; }
    button { background: var(--gold); border: none; padding: 2px 10px; cursor: pointer; font-weight: bold; font-size: 11px; border-radius: 3px; }

    #chart-wrap { height: 35%; width: 100%; flex-shrink: 0; background: #000; border-bottom: 2px solid var(--gold); }

    /* ТЕРМИНАЛ: Теперь идет сверху вниз */
    #terminal { 
        height: 65%; 
        background: #000; 
        overflow-y: auto; 
        padding: 10px 15px;
        display: flex;
        flex-direction: column; /* Убрали reverse, теперь стандартный порядок */
    }

    .row { 
        white-space: nowrap; 
        line-height: 1.6; 
        border-bottom: 1px solid #111; 
        font-size: 16px; 
        font-weight: 500;
        flex-shrink: 0;
    }
    
    .row.buy { color: var(--green); }
    .row.sell { color: var(--red); }
    .dim { color: var(--gray); font-size: 14px; }
    .gold { color: var(--gold); }
</style>

<script>
    let socket;

    function initTV() {
        if (typeof TradingView === 'undefined') {
            setTimeout(initTV, 500);
            return;
        }
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ru",
            "container_id": "tradingview_chart",
            "hide_side_toolbar": false,
            "hide_top_toolbar": true,
            "save_image": false
        });
    }

    function connect() {
        const targetIp = document.getElementById('ip').value;
        const st = document.getElementById('st');
        if (socket) socket.disconnect();
        
        socket = io(`http://${targetIp}:8080`, { transports: ['websocket'] });

        socket.on('connect', () => {
            st.innerText = "● ONLINE";
            st.style.color = "var(--green)";
        });

        socket.on('market_data', (data) => {
            addTerminalRow(data);
        });
    }

    function addTerminalRow(data) {
        const term = document.getElementById('terminal');
        const row = document.createElement('div');
        const isBuy = data.side === '+';
        
        row.className = `row ${isBuy ? 'buy' : 'sell'}`;
        row.innerHTML = `
            <span class="dim">[${data.time}]</span> 
            <b>${isBuy ? '▲ BUY ' : '▼ SELL'}</b> 
            <span style="font-size: 18px;">$${data.price}</span> 
            <span class="dim">| Vol:</span><span>${data.vol}</span> 
            <span class="dim">| TR:</span><span>${data.trades}</span> 
            <span class="dim">| Hold:</span><span class="gold">${data.hold}s</span> 
            <span class="dim">| RSI:</span><span class="gold">${data.rsi}</span>
        `;

        term.appendChild(row); // Добавляем в конец (вниз)

        // Авто-скролл к последней сделке
        term.scrollTop = term.scrollHeight;

        // Ограничение, чтобы не съедало память
        if (term.childNodes.length > 200) term.removeChild(term.firstChild);
    }

    initTV();
</script>
</body>
</html>
