<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Breathing Station | PRO Terminal v3.6</title>
    <link rel="icon" type="image/png" href="https://github.com/bt0501/BS/blob/main/icob.png?raw=true">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { 
            --bg: #0b0e11; --green: #0ecb81; --red: #f6465d; 
            --bright-red: #ff0000; --orange: #f0b90b; --pink: #ff69b4;
            --blue: #37b6ff; --cyan: #00ffff; --gray: #848e9c; --gold: #ffd700;
        }
        
        body { 
            background: var(--bg); color: #eaecef; 
            font-family: 'Consolas', monospace; margin: 0; padding: 0; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        #header { 
            height: 40px; display: flex; align-items: center; padding: 0 15px; 
            background: #161a1e; border-bottom: 1px solid #2b3139; 
            justify-content: space-between; flex-shrink: 0; 
        }
        .logo { color: var(--orange); font-size: 14px; font-weight: bold; }
        input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 4px 8px; width: 120px; font-size: 12px; border-radius: 3px; }
        button { background: var(--orange); border: none; padding: 4px 12px; cursor: pointer; font-weight: bold; font-size: 12px; border-radius: 3px; margin-left: 5px; }

        #chart-wrap { height: 50%; width: 100%; flex-shrink: 0; background: #000; border-bottom: 2px solid var(--orange); }

        .main-bottom-area { display: flex; height: 50%; overflow: hidden; }

        #terminal { 
            flex: 1.2; background: #000; overflow-y: auto; 
            padding: 10px 15px; display: flex; flex-direction: column; 
            scroll-behavior: smooth; border-right: 1px solid #2b3139;
        }

        #analytics-panel { flex: 1; background: #050505; display: flex; flex-direction: column; }

        .analytics-header { 
            padding: 10px 15px; background: #161a1e; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #2b3139;
        }

        .row { white-space: nowrap; line-height: 1.5; border-bottom: 1px solid #111; font-size: 14px; padding: 2px 0; }

        #stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #stats-table th { color: var(--gray); text-align: left; padding: 10px; border-bottom: 1px solid #222; background: #0f1215; position: sticky; top: 0; }
        #stats-table td { padding: 10px; border-bottom: 1px solid #111; }
        .high-vol-row { background: rgba(255, 215, 0, 0.05); border-left: 3px solid var(--gold); }

        .c-gray { color: var(--gray); } .c-orange { color: var(--orange); }
        .c-pink { color: var(--pink); } .c-red { color: var(--red); }
        .c-bright-red { color: var(--bright-red); font-weight: bold; }
        .c-blue { color: var(--blue); } .c-cyan { color: var(--cyan); } .c-green { color: var(--green); }
        
        .watermark { position: fixed; bottom: 5px; right: 25px; font-size: 12px; color: var(--orange); opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div id="header">
    <div class="logo">BREATHING_STATION_v3.6</div>
    <div class="status">
        <span id="st" style="color:var(--red)">● OFFLINE</span> | 
        IP: <input type="text" id="ip" value="">
        <button onclick="connect()">CONNECT</button>
    </div>
</div>

<div id="chart-wrap">
    <div id="tradingview_chart" style="width: 100%; height: 100%;"></div>
</div>

<div class="main-bottom-area">
    <div id="terminal"></div>
    <div id="analytics-panel">
        <div class="analytics-header">
            <span class="c-orange" style="font-weight:bold">HISTORY ANALYTICS</span>
            <div>
                <button onclick="setTF(1)">1m</button>
                <button onclick="setTF(5)">5m</button>
                <button onclick="setTF(60)">1h</button>
            </div>
        </div>
        <div style="overflow-y:auto; flex:1;">
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Full Time</th>
                        <th>Range</th>
                        <th>Vol</th>
                        <th>TR</th>
                        <th>Avg RSI</th>
                    </tr>
                </thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="watermark">Baitan_0501 白坦</div>

<script>
    let socket;
    let historyData = []; 
    let currentTF = 1;
    const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    // Загрузка сохраненного IP
    window.onload = () => {
        const savedIp = localStorage.getItem('station_ip');
        if (savedIp) document.getElementById('ip').value = savedIp;
        initTV();
    };

    function initTV() {
        new TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "15",
            "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "ru",
            "container_id": "tradingview_chart", "hide_top_toolbar": false
        });
    }

    function connect() {
        const targetIp = document.getElementById('ip').value;
        localStorage.setItem('station_ip', targetIp); // Сохраняем IP[cite: 2]
        
        const st = document.getElementById('st');
        if (socket) socket.disconnect();
        
        socket = io(`http://${targetIp}:8080`, { transports: ['websocket'] });
        socket.on('connect', () => { st.innerText = "● ONLINE"; st.style.color = "var(--green)"; });
        socket.on('market_data', (data) => { addTerminalRow(data); });
    }

    function addTerminalRow(data) {
        const term = document.getElementById('terminal');
        const row = document.createElement('div');
        
        const vol = parseFloat(data.vol);
        const trades = parseInt(data.trades);
        const hold = parseFloat(data.hold);
        const rsi = parseFloat(data.rsi);
        const isBuy = data.side === '+';

        // Звук на крупный объем
        if (vol >= 50) alertSound.play();

        let volClass = vol >= 50 ? 'c-bright-red' : vol >= 20 ? 'c-red' : vol >= 10 ? 'c-pink' : vol >= 1 ? 'c-orange' : 'c-gray';
        let trClass = trades > 1000 ? 'c-bright-red' : trades >= 500 ? 'c-red' : trades >= 50 ? 'c-orange' : 'c-gray';
        let rsiClass = rsi >= 70 ? 'c-red' : rsi <= 30 ? 'c-green' : 'c-blue';
        
        // Цвет для удержания: если больше 5 сек - яркий циан
        let holdClass = hold >= 5 ? 'c-cyan' : 'c-blue';

        row.className = 'row';
        row.innerHTML = `
            <span class="c-gray">[${data.time}]</span> 
            <b class="${isBuy ? 'c-green' : 'c-red'}">${isBuy ? '▲ BUY ' : '▼ SELL'}</b> 
            <span style="color: white; font-weight: bold;">$${data.price}</span> 
            <span class="c-gray">| V:</span><span class="${volClass}">${data.vol}</span> 
            <span class="c-gray">| T:</span><span class="${trClass}">${data.trades}</span> 
            <span class="c-gray">| H:</span><span class="${holdClass}">${data.hold}s</span> 
            <span class="c-gray">| R:</span><span class="${rsiClass}">${data.rsi}</span>
        `;

        term.appendChild(row); 
        term.scrollTop = term.scrollHeight;
        if (term.childNodes.length > 100) term.removeChild(term.firstChild);

        historyData.push({ t: Date.now(), p: parseFloat(data.price), v: vol, tr: trades, r: rsi });
        if (historyData.length > 5000) historyData.shift();
        renderAnalytics();
    }

    function renderAnalytics() {
        const interval = currentTF * 60 * 1000;
        const groups = {};
        
        historyData.forEach(d => {
            const key = Math.floor(d.t / interval) * interval;
            if (!groups[key]) groups[key] = { min: d.p, max: d.p, vol: 0, tr: 0, rsiSum: 0, count: 0 };
            groups[key].min = Math.min(groups[key].min, d.p);
            groups[key].max = Math.max(groups[key].max, d.p);
            groups[key].vol += d.v;
            groups[key].tr += d.tr;
            groups[key].rsiSum += d.r;
            groups[key].count++;
        });

        const body = document.getElementById('stats-body');
        body.innerHTML = '';
        Object.keys(groups).sort((a,b) => b-a).slice(0, 30).forEach(t => {
            const g = groups[t];
            const avgRsi = (g.rsiSum / g.count).toFixed(1);
            let rClass = avgRsi >= 70 ? 'c-red' : avgRsi <= 30 ? 'c-green' : 'c-blue';
            
            // Формат времени с секундами
            const timeStr = new Date(parseInt(t)).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            const isHighVol = g.vol > 100; // Подсветка аномального объема в истории

            body.innerHTML += `<tr class="${isHighVol ? 'high-vol-row' : ''}">
                <td class="c-gray">${timeStr}</td>
                <td style="color:white; font-weight:bold;">$${g.min.toFixed(2)} - ${g.max.toFixed(2)}</td>
                <td class="${isHighVol ? 'c-bright-red' : 'c-orange'}">${g.vol.toFixed(2)}</td>
                <td class="c-pink">${g.tr}</td>
                <td class="${rClass}">${avgRsi}</td>
            </tr>`;
        });
    }

    function setTF(m) { currentTF = m; renderAnalytics(); }
</script>
</body>
</html>
