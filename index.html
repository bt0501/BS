<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Breathing Station | PRO Terminal</title>
    <!-- Библиотеки -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { 
            --bg: #0b0e11; --green: #0ecb81; --red: #f6465d; 
            --bright-red: #ff0000; --orange: #f0b90b; --pink: #ff69b4;
            --blue: #37b6ff; --cyan: #00ffff; --gray: #848e9c; 
        }
        
        body { 
            background: var(--bg); 
            color: #eaecef; 
            font-family: 'Consolas', monospace; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Шапка */
        #header { 
            height: 35px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            background: #161a1e; 
            border-bottom: 1px solid #2b3139; 
            justify-content: space-between; 
            flex-shrink: 0; 
        }
        .logo { color: var(--orange); font-size: 12px; font-weight: bold; letter-spacing: 1px; }
        .status { font-size: 11px; }
        input { background: #2b3139; border: 1px solid #474d57; color: white; padding: 2px 5px; width: 100px; font-size: 11px; border-radius: 3px; }
        button { background: var(--orange); border: none; padding: 2px 10px; cursor: pointer; font-weight: bold; font-size: 11px; border-radius: 3px; }

        /* График */
        #chart-wrap { height: 35%; width: 100%; flex-shrink: 0; background: #000; border-bottom: 2px solid var(--orange); }

        /* Терминал */
        #terminal { 
            height: 65%; 
            background: #000; 
            overflow-y: auto; 
            padding: 10px 15px;
            display: flex;
            flex-direction: column; 
            scroll-behavior: smooth;
        }

        .row { 
            white-space: nowrap; 
            line-height: 1.6; 
            border-bottom: 1px solid #111; 
            font-size: 16px; 
            font-weight: 500;
            flex-shrink: 0;
            padding: 2px 0;
        }

        /* Классы раскраски */
        .c-gray { color: var(--gray); }
        .c-orange { color: var(--orange); }
        .c-pink { color: var(--pink); }
        .c-red { color: var(--red); }
        .c-bright-red { color: var(--bright-red); font-weight: bold; text-shadow: 0 0 8px rgba(255,0,0,0.4); }
        .c-blue { color: var(--blue); }
        .c-cyan { color: var(--cyan); }
        .c-green { color: var(--green); }
        
        .watermark { position: fixed; bottom: 5px; right: 25px; font-size: 12px; color: var(--orange); opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div id="header">
    <div class="logo">BREATHING_STATION_v3.2</div>
    <div class="status">
        <span id="st" style="color:var(--red)">● OFFLINE</span> | 
        IP: <input type="text" id="ip" value="192.168.1.118">
        <button onclick="connect()">CONNECT</button>
    </div>
</div>

<div id="chart-wrap">
    <div id="tradingview_chart" style="width: 100%; height: 100%;"></div>
</div>

<div id="terminal"></div>

<div class="watermark">Baitan_0501 白坦</div>

<script>
    let socket;

    function initTV() {
        if (typeof TradingView === 'undefined') {
            setTimeout(initTV, 500);
            return;
        }
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ru",
            "container_id": "tradingview_chart",
            "hide_top_toolbar": true,
            "save_image": false
        });
    }

    function connect() {
        const targetIp = document.getElementById('ip').value;
        const st = document.getElementById('st');
        if (socket) socket.disconnect();
        
        socket = io(`http://${targetIp}:8080`, { transports: ['websocket'] });

        socket.on('connect', () => {
            st.innerText = "● ONLINE";
            st.style.color = "var(--green)";
        });

        socket.on('market_data', (data) => {
            addTerminalRow(data);
        });
    }

    function addTerminalRow(data) {
        const term = document.getElementById('terminal');
        const row = document.createElement('div');
        
        // Превращаем данные в числа для логики
        const vol = parseFloat(data.vol);
        const trades = parseInt(data.trades);
        const hold = parseFloat(data.hold);
        const rsi = parseFloat(data.rsi);
        const isBuy = data.side === '+';

        // 1. Логика цвета ОБЪЕМА (Vol)
        let volClass = 'c-gray';
        if (vol >= 50) volClass = 'c-bright-red';
        else if (vol >= 20) volClass = 'c-red';
        else if (vol >= 10) volClass = 'c-pink';
        else if (vol >= 1) volClass = 'c-orange';

        // 2. Логика цвета СДЕЛОК (TR)
        let trClass = 'c-gray';
        if (trades > 1000) trClass = 'c-bright-red';
        else if (trades >= 500) trClass = 'c-red';
        else if (trades >= 50) trClass = 'c-orange';

        // 3. Логика цвета ХОЛДА (Hold)
        let holdClass = hold > 5 ? 'c-cyan' : 'c-blue';

        // 4. Логика цвета RSI
        let rsiClass = 'c-blue'; 
        if (rsi >= 70) rsiClass = 'c-red'; 
        else if (rsi <= 30) rsiClass = 'c-green'; 

        row.className = 'row';
        row.innerHTML = `
            <span class="c-gray">[${data.time}]</span> 
            <b class="${isBuy ? 'c-green' : 'c-red'}">${isBuy ? '▲ BUY ' : '▼ SELL'}</b> 
            <span style="font-size: 18px; color: white;">$${data.price}</span> 
            <span class="c-gray">| Vol:</span><span class="${volClass}">${data.vol}</span> 
            <span class="c-gray">| TR:</span><span class="${trClass}">${data.trades}</span> 
            <span class="c-gray">| Hold:</span><span class="${holdClass}">${data.hold}s</span> 
            <span class="c-gray">| RSI:</span><span class="${rsiClass}">${data.rsi}</span>
        `;

        term.appendChild(row); 
        term.scrollTop = term.scrollHeight;

        if (term.childNodes.length > 150) {
            term.removeChild(term.firstChild);
        }
    }

    initTV();
</script>
</body>
</html>
