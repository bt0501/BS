<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Station Pro | Live Flow</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #0b0e11; --card-bg: #1e2329; --green: #0ecb81; --red: #f6465d; --gold: #f0b90b; }
        body { background: var(--bg); color: #eaecef; font-family: 'Roboto Mono', monospace; margin: 0; overflow: hidden; }
        
        #header { height: 50px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #2b3139; justify-content: space-between; }
        .logo { color: var(--gold); font-weight: bold; font-size: 18px; }
        
        #chart-container { height: calc(100vh - 150px); width: 100%; }

        /* Бегущая строка / Лента */
        #ticker-container { 
            height: 80px; 
            background: #161a1e; 
            border-top: 2px solid var(--gold); 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            white-space: nowrap;
            position: relative;
        }

        .ticker-track { display: flex; align-items: center; animation: scroll 20s linear infinite; }
        
        .stat-card {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 10px;
            background: var(--card-bg);
            border-radius: 4px;
            border-left: 3px solid #474d57;
        }

        .stat-card.buy { border-left-color: var(--green); color: var(--green); }
        .stat-card.sell { border-left-color: var(--red); color: var(--red); }

        .label { font-size: 10px; color: #848e9c; display: block; text-transform: uppercase; }
        .val { font-size: 16px; font-weight: bold; }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ip-config { font-size: 10px; color: #474d57; }
        input { background: transparent; border: 1px solid #2b3139; color: #848e9c; width: 100px; font-size: 10px; }
    </style>
</head>
<body>

<div id="header">
    <div class="logo">BREATHING STATION <span style="color:white">PRO</span></div>
    <div class="ip-config">
        IP: <input type="text" id="targetIp" value="192.168.1.118">
        <button onclick="connect()">Link</button>
    </div>
</div>

<div id="chart-container"></div>

<div id="ticker-container">
    <div id="ticker" class="ticker-track">
        <!-- Карточки будут влетать сюда -->
    </div>
</div>

<script>
    let socket;
    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
        layout: { backgroundColor: '#0b0e11', textColor: '#848e9c' },
        grid: { vertLines: { color: '#1f2226' }, horzLines: { color: '#1f2226' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: true }
    });

    const areaSeries = chart.addAreaSeries({
        lineColor: '#f0b90b',
        topColor: 'rgba(240, 185, 11, 0.3)',
        bottomColor: 'rgba(240, 185, 11, 0.0)',
        lineWidth: 2,
    });

    function connect() {
        const ip = document.getElementById('targetIp').value;
        if (socket) socket.disconnect();
        socket = io(`http://${ip}:8080`);

        socket.on('market_data', (data) => {
            const timeVal = Math.floor(Date.now() / 1000);
            const price = parseFloat(data.price);
            
            // Обновляем график
            areaSeries.update({ time: timeVal, value: price });

            // Создаем новую карточку в ленте
            updateTicker(data);
        });
    }

    function updateTicker(data) {
        const ticker = document.getElementById('ticker');
        const card = document.createElement('div');
        const sideClass = data.side === '+' ? 'buy' : 'sell';
        
        card.className = `stat-card ${sideClass}`;
        card.innerHTML = `
            <span class="label">${data.time}</span>
            <span class="val">$${data.price} | Vol: ${data.vol} | TR: ${data.trades} | Ice: ${data.hold}s | RSI: ${data.rsi}</span>
        `;

        ticker.prepend(card);

        // Удаляем старые карточки, чтобы не тормозило
        if (ticker.childNodes.length > 20) {
            ticker.removeChild(ticker.lastChild);
        }
    }

    // Ресайз графика при изменении окна
    window.addEventListener('resize', () => {
        chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 150 });
    });

    connect();
</script>
</body>
</html>
